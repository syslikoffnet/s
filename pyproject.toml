[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healdragg"
version = "1.3.0"
description = "Healdragg — каталог публичных групп Telegram, OSINT-панель, TUI, веб и бот"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "syslikoffnet" }]
keywords = ["telegram", "telethon", "osint", "catalog", "rich", "tui", "bot"]
dependencies = [
    "telethon>=1.36",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
bot = ["aiogram>=3.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "aiogram>=3.20"]

[project.scripts]
healdragg = "healdragg.cli:main"

[project.urls]
Homepage = "https://github.com/syslikoffnet/s"

[tool.setuptools.packages.find]
include = ["healdragg*"]

[tool.setuptools.package-data]
healdragg = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
