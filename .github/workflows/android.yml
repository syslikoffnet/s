name: Android APK

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "healdragg/**"
      - "install.sh"
      - "pyproject.toml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Chaquopy собирает .pyc и ставит python-пакеты тем же интерпретатором,
      # что живёт в APK, — на сборщике должен быть Python 3.13.
      - name: Python 3.13 для Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Сборка debug + release
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Локальные артефакты
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/healdragg-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/healdragg-release.apk
          ls -lh artifacts

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: healdragg-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Приложить к релизу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk

      # Release-событие срабатывает только с workflow из default-ветки, поэтому
      # APK из обычной сборки докладываем в уже существующий релиз вручную.
      - name: Обновить ассеты релиза
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/healdragg-debug.apk artifacts/healdragg-release.apk --clobber
            echo "APK приложены к $TAG"
          else
            echo "Релиз $TAG ещё не создан — пропускаю"
          fi
